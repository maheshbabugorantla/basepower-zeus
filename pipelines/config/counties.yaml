# Per-county parcel source registry.
#
# Each entry names the pipelines/sources/<name>.py adapter that loads that
# county's parcel attributes into core.parcels, plus the county_fips and
# tax_year that adapter loads. A later county (e.g. Harris, M3) plugs in a
# different adapter by adding its own block here — never by editing an
# existing county's block or the adapter that reads it.
#
# Parsed by pipelines/sources/parcels.py's tiny hand-rolled loader (no
# PyYAML dependency is declared in pipelines/requirements.txt, and this
# file's shape is deliberately kept to that loader's supported subset:
# top-level county keys, each a flat map of scalar string/int values).
travis:
  fips: "48453"
  parcel_adapter: tcad_certified_export
  tax_year: 2026

# Harris (M3-P2): HCAD bulk export (real_acct.txt + jur_exempt_cd.txt)
# plus HCAD's own public ArcGIS REST parcel layer for geometry. See
# checks/M3-P2.md and pipelines/sources/hcad_parcels.py's module
# docstring for source URLs and the load strategy (filtered to
# single-family homesteads before loading).
harris:
  fips: "48201"
  parcel_adapter: hcad_bulk_export
  tax_year: 2026

williamson:
  fips: "48491"
  parcel_adapter: wcad_property_data_export
  tax_year: 2026
